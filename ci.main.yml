schemaVersion: v0.5
prepare:
  steps: []
test:
  steps: []
run:
  uptime-kuma:
    healthEndpoint: http://localhost:3001/
    plan: 101
    replicas: 1
    network:
      ports:
        - 3000
        - 3001
    env:
      UPTIME_KUMA_DB_TYPE: sqlite
    runAsUser: 1501
    runAsGroup: 1010
    volumeMounts:
      - name: _workspace
        mountPath: /home/user/app
        workspacePath: ""
      - name: _workspace
        mountPath: app/data/
        workspacePath: data
    image: louislam/uptime-kuma:2.5.4
  cs-router:
    type: router
    plan: 101
    replicaCount: 1
    network:
      isLandscapeGateway: true
      paths:
        - path: /
          stripPath: false
          service: uptime-kuma
          port: 3001
